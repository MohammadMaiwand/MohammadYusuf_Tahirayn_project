<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Auto Answer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img src="../assets/icons/icon48.png" alt="" class="logo" width="32" height="32" />
    <div class="titles">
      <h1>Smart Auto Answer</h1>
      <p class="version">نسخهٔ ۱.۰.۰</p>
    </div>
    <span id="statusDot" class="status-dot status-idle" title="وضعیت"></span>
  </header>

  <section class="card">
    <label class="switch-row">
      <span class="row-title">پاسخ خودکار فعال</span>
      <input type="checkbox" id="enabledToggle" class="switch" />
    </label>
    <p class="hint" id="statusText">در حال بارگذاری…</p>
  </section>

  <section class="card">
    <h2>سایت‌ها</h2>
    <div id="sitesList" class="sites"></div>
  </section>

  <section class="card">
    <h2>تنظیمات</h2>
    <div class="field">
      <label for="cooldownInput">فاصلهٔ خنک‌سازی (میلی‌ثانیه)</label>
      <input type="number" id="cooldownInput" min="500" max="15000" step="500" />
    </div>
    <div class="field">
      <label for="thresholdInput">آستانهٔ اطمینان (۰ تا ۱)</label>
      <input type="number" id="thresholdInput" min="0.3" max="0.99" step="0.01" />
    </div>
    <label class="switch-row">
      <span class="row-title">اعلان‌های ویندوز</span>
      <input type="checkbox" id="notifyToggle" class="switch" />
    </label>
  </section>

  <section class="card">
    <h2>وضعیت سیستم</h2>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="detectedCount">۰</span><span class="stat-label">تشخیص</span></div>
      <div class="stat"><span class="stat-num" id="answeredCount">۰</span><span class="stat-label">پاسخ داده‌شده</span></div>
      <div class="stat"><span class="stat-num" id="tabsCount">۰</span><span class="stat-label">تب پایش‌شده</span></div>
    </div>
    <p class="hint" id="nativeText">اتصال به برنامهٔ دسکتاپ: نامشخص</p>
  </section>

  <section class="actions">
    <button id="testBtn" class="btn btn-primary">آزمون تشخیص در تب فعال</button>
    <button id="logsBtn" class="btn btn-secondary">مشاهدهٔ گزارش‌ها</button>
  </section>

  <div id="testResult" class="test-result hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
